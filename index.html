    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(8px, 2vh, 20px);

        }

        .container {
            max-width: 400px;

            max-height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;

        .header {
            margin-bottom: clamp(14px, 4vh, 40px);
        }

        .title {
            font-size: clamp(1.6rem, 5.5vh, 2.5rem);
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        .subtitle {
            font-size: clamp(0.85rem, 2vh, 1.1rem);
            color: #9ca3af;
            font-weight: 400;

        .emergency-buttons {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.8vh, 22px);
            margin-bottom: clamp(12px, 3vh, 30px);
        }

        .emergency-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: clamp(10px, 2vh, 20px) 25px;
            border: none;
            border-radius: 16px;
            font-size: clamp(1rem, 2.4vh, 1.3rem);
            font-weight: 700;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            min-height: clamp(52px, 9vh, 80px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .emergency-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .emergency-btn:hover::before {
            left: 100%;
        }

        .javerim-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .javerim-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .hatzala-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .hatzala-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4);
        }

        .shomrim-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706); /* ámbar / dorado */
        }

        .shomrim-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.4);
        }
        .emergency-btn:active {
            transform: translateY(-1px);
        }

        .icon {
            font-size: clamp(1.3rem, 2.8vh, 1.8rem);
        }

        .info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: clamp(10px, 2vh, 20px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-title {
            font-size: clamp(0.9rem, 2vh, 1.1rem);
            font-weight: 600;
            margin-bottom: 6px;
            color: #f3f4f6;
        }

        .info-text {
            font-size: clamp(0.8rem, 1.7vh, 0.9rem);
            color: #d1d5db;
            line-height: 1.4;
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .8;
            }
        }

        @media (max-height: 640px) {
            .info {
                display: none;
            }
        }

        /* PWA Install Banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .install-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .close-banner {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dac-btn {
            background: linear-gradient(135deg, #10b981, #047857); /* verde seguridad */
        }

        .dac-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
        }

        .gmaj-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: clamp(10px, 2vh, 18px);
            padding: clamp(8px, 1.4vh, 10px) 18px;
            font-size: clamp(0.78rem, 1.7vh, 0.85rem);
            font-weight: 500;
            color: #d1d5db;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .gmaj-link:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .gmaj-link:active {
            transform: translateY(0);
        }

        .gmaj-link .icon {
            font-size: clamp(0.9rem, 1.8vh, 1rem);
        }
    </style>
</head>
<body>

    <!-- PWA Install Banner -->
    <div id="installBanner" class="install-banner">

    </div>

    <script>
        // Service Worker Registration (solo para HTTPS/localhost)
        if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const swUrl = './service_worker.js?v=11'; // ↑ subí este número en cada deploy
      const reg = await navigator.serviceWorker.register(swUrl);

      // Detecta nuevas versiones y aplícalas YA
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });

      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            sw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });

      // Cuando el SW nuevo toma control, recargamos para ver el HTML nuevo
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });

      // Chequeá updates al volver a foreground (iOS/Pages ayudan con esto)
      const poke = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') poke();
      });
    } catch (e) {
      console.log('No se pudo registrar el SW', e);
    }
  });
}

          // Detectar iOS y standalone
  function isIos() {
    return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  }

  function isInStandaloneMode() {
    return ('standalone' in window.navigator) && window.navigator.standalone;
  }

  // PWA Install Prompt (Android/Chrome)
  let deferredPrompt;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const closeBanner = document.getElementById('closeBanner');

  // ---- iOS ----
  if (isIos() && !isInStandaloneMode()) {
    // Mostrar banner con instrucciones propias
    installBanner.style.display = 'flex';
    installBtn.style.display = 'none'; // ocultar botón Instalar
    // Cambiar el texto del banner para iOS
    installBanner.querySelector('span').textContent = "📱 En iPhone: toca Compartir → 'Agregar a pantalla de inicio'";
  }

  // ---- Android/Chrome ----
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`User response to the install prompt: ${outcome}`);
      deferredPrompt = null;
      installBanner.style.display = 'none';
    }
  });

  closeBanner.addEventListener('click', () => {
    installBanner.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBanner.style.display = 'none';
    console.log('PWA was installed');
  });


        closeBanner.addEventListener('click', () => {
            installBanner.style.display = 'none';
        });

        // Hide banner if app is already installed
        window.addEventListener('appinstalled', () => {
            installBanner.style.display = 'none';
            console.log('PWA was installed');
        });

        // Vibration feedback for emergency buttons
        document.querySelectorAll('.emergency-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate([200, 100, 200]);
                }
            });
        });

        // Prevent context menu on long press for better mobile experience
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Add visual feedback on touch
        document.querySelectorAll('.emergency-btn').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'translateY(-1px) scale(0.98)';
            });

            btn.addEventListener('touchend', function() {
                this.style.transform = '';
            });
        });
    </script>
